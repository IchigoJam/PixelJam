<!doctype html><meta charset="utf-8">
<canvas id=c></canvas>
<script>
/* PICO-8風ミニエンジン(だいたい100行) */
const W=128,H=128,S=4, c=document.getElementById("c");
c.width=W*S; c.height=H*S; const g=c.getContext("2d"); g.imageSmoothingEnabled=false;
const pal=["#000000","#1D2B53","#7E2553","#008751","#AB5236","#5F574F","#C2C3C7","#FFF1E8",
           "#FF004D","#FFA300","#FFEC27","#00E436","#29ADFF","#83769C","#FF77A8","#FFCCAA"];
const img=g.createImageData(W,H), pix=img.data;
let keys=Object.create(null), t0=0, frame=0;
addEventListener("keydown",e=>keys[e.code]=1);
addEventListener("keyup",e=>keys[e.code]=0);

function cls(ci=0){ const [r,g,b]=hex(pal[ci&15]); for(let i=0;i<pix.length;i+=4){pix[i]=r;pix[i+1]=g;pix[i+2]=b;pix[i+3]=255;} }
function pset(x,y,ci=7){ x|=0;y|=0; if(x<0||y<0||x>=W||y>=H) return; const i=(y*W+x)*4; const [r,g,b]=hex(pal[ci&15]); pix[i]=r;pix[i+1]=g;pix[i+2]=b;pix[i+3]=255; }
function rectfill(x0,y0,x1,y1,ci=7){ x0|=0;y0|=0;x1|=0;y1|=0; if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0];
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) pset(x,y,ci);
}
function line(x0,y0,x1,y1,ci=7){ x0|=0;y0|=0;x1|=0;y1|=0; let dx=Math.abs(x1-x0),sx=x0<x1?1:-1, dy=-Math.abs(y1-y0),sy=y0<y1?1:-1, err=dx+dy;
  for(;;){ pset(x0,y0,ci); if(x0===x1&&y0===y1) break; let e2=2*err; if(e2>=dy){err+=dy;x0+=sx} if(e2<=dx){err+=dx;y0+=sy} }
}
function circfill(cx,cy,r,ci=7){ cx|=0;cy|=0;r|=0; for(let y=-r;y<=r;y++) for(let x=-r;x<=r;x++) if(x*x+y*y<=r*r) pset(cx+x,cy+y,ci); }
function print(s,x,y,ci=7){ x|=0;y|=0; // 超ミニ: 3x5フォント(必要分だけ)
  const f={"A":[2,5,7,5,5],"B":[6,5,6,5,6],"C":[3,4,4,4,3],"E":[7,4,6,4,7],
           "H":[5,5,7,5,5],"L":[4,4,4,4,7],"O":[2,5,5,5,2],"P":[6,5,6,4,4],
           "R":[6,5,6,5,5],"S":[3,4,2,1,6],"T":[7,2,2,2,2],"I":[7,2,2,2,7],
           "0":[7,5,5,5,7],"1":[2,6,2,2,7],"2":[7,1,7,4,7],"3":[7,1,7,1,7],
           "4":[5,5,7,1,1],"5":[7,4,7,1,7],"6":[7,4,7,5,7],"7":[7,1,1,1,1],
           "8":[7,5,7,5,7],"9":[7,5,7,1,7],"!":[2,2,2,0,2]," ":[0,0,0,0,0],
           "-":[0,0,7,0,0],".":[0,0,0,0,2]};
  for(const ch of (""+s).toUpperCase()){
    const rows=f[ch]||f[" "];
    for(let yy=0;yy<5;yy++){ let bits=rows[yy]; for(let xx=0;xx<3;xx++) if(bits&(1<<(2-xx))) pset(x+xx,y+yy,ci); }
    x+=4;
  }
}
function btn(i){ // 0..5 = ←→↑↓ Z X
  return !!([keys.ArrowLeft,keys.ArrowRight,keys.ArrowUp,keys.ArrowDown,keys.KeyZ,keys.KeyX][i]);
}
function hex(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function flip(){ g.putImageData(img,0,0); g.drawImage(c,0,0,W,H,0,0,W*S,H*S); }

function TIC(dt){ // ここを書き換えるだけでゲームが作れる！
  const x=64+Math.sin(frame*0.05)*30, y=64+Math.cos(frame*0.04)*30;
  cls(1); rectfill(0,0,127,20,0); print("PICO-8-ish JS",2,2,10); print("Z/X + ARROWS",2,10,7);
  circfill(x,y,8,btn(4)?8:12); line(0,127,127,0,3); if(btn(5)) rectfill(40,90,88,120,9);
}

function loop(t){ const dt=(t-t0)/1000; t0=t; TIC(dt); flip(); frame++; requestAnimationFrame(loop); }
cls(); requestAnimationFrame(loop);
</script>
