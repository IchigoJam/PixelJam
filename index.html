<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" href="data:">
<title>PixelJam</title>
</head><body>
<script type="module">
import { cls, rectfill, print, circfill, line, btn, stamp, wait } from "./PixelJam.js";
import { BLACK, WHITE, RED, PINK, ORANGE, YELLOW, L_BROWN, BROWN, L_GREEN, GREEN, L_BLUE, BLUE, D_BLUE, B_PURPLE, R_PURPLE, GRAY } from "https://ichigojam.github.io/PanCake-res/PANCAKE_COLORS.js";

const ICON_I = `
  00333300
  03000030
  300AA003
  30000003
  300AA003
  30088003
  03000030
  00333300
`;

const ICON_SACCHAN_1 = `
11177111
11166111
11755711
11566511
11122111
11222211
11166111
11100111`;

const SPR_SACCHAN_2 = `
61177116
15766751
11555511
11155111
11222211
11066011
11111111
11111111`;

const SPR_SACCHAN_3 = `
61177116
15766751
11555511
11155111
11122111
11222211
11166111
11100111`;

for (let i = 0;; i++) {
  const frame = i;
  const x = 64 + Math.sin(frame * 0.05) * 30;
  const y = 64 + Math.cos(frame * 0.04) * 30;
  cls(WHITE);
  rectfill(0, 0, 128, 20, D_BLUE);
  print("PixelJam.js", 2, 2, YELLOW);
  print("ARROWS + Space/Z/X", 2, 10, R_PURPLE);
  circfill(x, y, 7, btn(4) ? RED : PINK);
  stamp(ICON_I, x + 10, y - 3);
  stamp(ICON_SACCHAN_1, x + 20, y - 3, 8, 1);
  stamp((i >> 4) % 0xb0, x - 20, y - 3, 8, 1);
  line(0, 127, 127, 0, GREEN);

  const y0 = 30;
  const w = 5;
  rectfill(2, y0, w, w, btn(0) ? BLACK : GRAY); // left
  rectfill(2 + w + w, y0, w, w, btn(1) ? BLACK : GRAY); // right
  rectfill(2 + w, y0 - w, w, w, btn(2) ? BLACK : GRAY); // up
  rectfill(2 + w, y0 + w, w, w, btn(3) ? BLACK : GRAY); // down

  rectfill(2 + w * 4, y0, w, w, btn(4) ? BLACK : GRAY); // space
  rectfill(2 + w * 6, y0, w, w, btn(5) ? BLACK : GRAY); // x
  rectfill(2 + w * 8, y0, w, w, btn(6) ? BLACK : GRAY); // z
  await wait(1);
}

</script>
</body></html>
